services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: soulseek_vpn
    restart: unless-stopped

    cap_add:
      - NET_ADMIN

    devices:
      - /dev/net/tun:/dev/net/tun

    networks:
      - docker-network

    environment:
      VPN_SERVICE_PROVIDER: ${VPN_SERVICE_PROVIDER}
      VPN_TYPE: ${VPN_TYPE}
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY}
      SERVER_COUNTRIES: ${SERVER_COUNTRIES}
      FIREWALL_VPN_INPUT_PORTS: ${FIREWALL_VPN_INPUT_PORTS}

    ports:
      - 5030:5030 # slskd web‑UI
      - 5031:5031
      - ${FIREWALL_VPN_INPUT_PORTS}:${FIREWALL_VPN_INPUT_PORTS} # P2P port (UDP/TCP inside tunnel)

  slskd:
    image: slskd/slskd:latest
    container_name: slskd
    network_mode: service:gluetun # route through VPN
    restart: unless-stopped

    environment:
      SLSKD_REMOTE_CONFIGURATION: "true"
      SLSKD_SLSK_LISTEN_PORT: ${FIREWALL_VPN_INPUT_PORTS}
      SLSKD_DOWNLOADS_DIR: /music/downloads
      SLSKD_INCOMPLETE_DIR: /music/incomplete

    volumes:
      - ${CONFIGS_DIR}/soulseek:/app
      - ${MEDIA_DIR}/Music/Soulseek:/music
    user: ${PUID}:${PGID}

networks:
  docker-network:
    external: true