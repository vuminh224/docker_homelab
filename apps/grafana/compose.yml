services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    user: 568:568
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - ${CONFIGS_DIR}/grafana/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${CONFIGS_DIR}/grafana/prometheus/data:/prometheus
    #ports:
    #  - 9090:9090
    networks:
      - monitoring
  node_exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
    #expose:
    #  - "9100"
    networks:
      - monitoring

  # Proxmox
  pve-exporter:
    image: prompve/prometheus-pve-exporter:latest
    container_name: pve-exporter
    restart: unless-stopped
    environment:
      - PVE_USER=root@pam
      - PVE_TOKEN_NAME=pve-exporter
      - PVE_TOKEN_VALUE=${PVE_TOKEN_VALUE}
      - PVE_VERIFY_SSL=false
    networks:
      - monitoring
      - docker-network

  # TrueNAS
    truenas-exporter:
    image: ghcr.io/unknowlars/truenas-scale-api-prometheus-exporter:latest
    container_name: truenas-exporter
    restart: unless-stopped

    #ports:
    #  - "9108:9108"

    environment:
      TRUENAS_WS_URL: ${TRUENAS_WS_URL}
      TRUENAS_API_KEY: ${TRUENAS_API_KEY}
      TRUENAS_VERIFY_TLS: "false"

      EXPORTER_PORT: "9108"
      SCRAPE_INTERVAL_SECONDS: "30"
      TRUENAS_TIMEOUT_SECONDS: "20"
      LOG_LEVEL: "INFO"

      ENABLE_EVENT_STREAMS: "true"
      ENABLE_DATASET_METRICS: "true"
      ENABLE_TASK_METRICS: "true"
      ENABLE_IPMI_METRICS: "false"
      ENABLE_GENERIC_METHOD_METRICS: "false"
      ENABLE_GENERIC_EVENT_METRICS: "false"

    networks: 
      - monitoring
      - docker-network

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yml
    user: 568:568
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIGS_DIR}/grafana/loki/loki.yml:/etc/loki/loki.yml:ro
      - ${CONFIGS_DIR}/grafana/loki/data:/loki
    #expose:
    #  - "3100"
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    user: 568:568
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    restart: unless-stopped
    volumes:
      - ${CONFIGS_DIR}/grafana/grafana/data:/var/lib/grafana
    #ports:
    #  - 32600:3000
    networks:
      - monitoring
      - docker-network
      
networks:
  monitoring:
    driver: bridge
  docker-network:
    external: true

