services:
  gluetun_prowlarr:
    image: qmcgaw/gluetun:latest
    container_name: gluetun_prowlarr
    restart: unless-stopped

    cap_add:
      - NET_ADMIN

    devices:
      - /dev/net/tun:/dev/net/tun

    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}

      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}
      - VPN_TYPE=${VPN_TYPE}
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - SERVER_COUNTRIES=${SERVER_COUNTRIES}
      - HTTPPROXY=on
      - HTTPPROXY_LOG=on

    volumes:
      - ${CONFIGS_DIR}/arr/gluetun_prowlarr:/gluetun

    ports:
      - 30030:9696

    networks:
      - docker-network

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped

    depends_on:
      - gluetun_prowlarr

    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}

    volumes:
      - ${CONFIGS_DIR}/arr/prowlarr:/config

    network_mode: service:gluetun_prowlarr

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped

    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}

    volumes:
      - ${CONFIGS_DIR}/arr/radarr:/config
      - ${MEDIA_DIR}:/media
    ports:
      - 7878:7878
    networks:
      - docker-network

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped

    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}

    volumes:
      - ${CONFIGS_DIR}/arr/sonarr:/config
      - ${MEDIA_DIR}:/media

    ports:
      - 8989:8989

    networks:
      - docker-network

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    restart: unless-stopped

    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}

    volumes:
      - ${CONFIGS_DIR}/arr/lidarr:/config
      - ${MEDIA_DIR}:/media

    ports:
      - 8686:8686

    networks:
      - docker-network
    
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped

    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}

    volumes:
      - ${CONFIGS_DIR}/arr/bazarr:/config
      - ${MEDIA_DIR}:/media
      
    ports:
      - 6767:6767

    networks:
      - docker-network

networks:
  docker-network:
    external: true