services:
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:32400/identity >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

    networks:
      - docker-network

    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - VERSION=docker

    volumes:
      - ${CONFIGS_DIR}/plex/configs:/config
      - ${CONFIGS_DIR}/plex/logs:/logs
      - ${CONFIGS_DIR}/plex/transcode:/transcode
      - ${MEDIA_DIR}:/media

    devices:
      - /dev/dri:/dev/dri

networks:
  docker-network:
    external: true
