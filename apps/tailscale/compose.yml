services:
  tailscale:
    image: tailscale/tailscale
    restart: unless-stopped

    volumes:
      - ${CONFIGS_DIR}/tailscale:/var/lib
      - /dev/net/tun:/dev/net/tun

    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_ROUTES=${TS_ROUTES}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_EXTRA_ARGS=--advertise-exit-node
      - TS_USERSPACE=false

    network_mode: host

    cap_add:
      - NET_ADMIN
      - NET_RAW

networks: {}