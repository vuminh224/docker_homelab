services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
      REDIS_HOSTNAME: immich_redis
      DB_HOSTNAME: database
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE_NAME: ${DB_DATABASE_NAME}
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ${DATA_STORAGE}/data_storage_immich:/data
      - /etc/localtime:/etc/localtime:ro
    #ports:
    #  - 2283:2283
    networks:
      - docker-network
      - immich-internal
    depends_on:
      - redis
      - database
    restart: unless-stopped
    healthcheck:
      disable: false
  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}-openvino
    environment:
      TZ: ${TZ}
      MACHINE_LEARNING_MODEL_TTL: ${MACHINE_LEARNING_MODEL_TTL}
      MACHINE_LEARNING_MODEL_TTL_POLL_S: ${MACHINE_LEARNING_MODEL_TTL_POLL_S}
    group_add:
      - video
    device_cgroup_rules:
      - c 189:* rmw
    devices:
      - /dev/dri:/dev/dri
    networks:
      - immich-internal
    volumes:
      - model-cache:/cache
      - /dev/bus/usb:/dev/bus/usb
    restart: unless-stopped
    healthcheck:
      disable: false
  redis:
    container_name: immich_redis
    networks:
      - immich-internal
    image: docker.io/valkey/valkey:8-bookworm@sha256:fea8b3e67b15729d4bb70589eb03367bab9ad1ee89c876f54327fc7c6e618571
    healthcheck:
      test: redis-cli ping || exit 1
    restart: unless-stopped
  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      TZ: ${TZ}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: --data-checksums
      DB_STORAGE_TYPE: HDD
    networks:
      - immich-internal
    volumes:
      - ${CONFIGS_DIR}/immich/db:/var/lib/postgresql/data
    shm_size: 128mb
    restart: unless-stopped
volumes:
  model-cache: null
networks:
  immich-internal: null
  docker-network:
    external: true